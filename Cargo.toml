[package]
name = "offline-translator-linux"
version = "0.1.2"
edition = "2024"

[dependencies]
cld2 = { git = "https://github.com/DavidVentura/rust-cld2.git" }
#cld2 = { path = "../rust-cld2" }
ureq = "3.1.2"
qmetaobject = "0.2"
qttypes = "0.2"
cpp = "0.5"
flate2 = "1.0"
rayon = "1.10"
whoami = { version = "1.6.1", default-features = false }
zip = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Must match translator's glow so GlesRenderer and our FBO share one type/context.
glow = { version = "0.17", default-features = false }

[dependencies.translator]
# git = "https://github.com/DavidVentura/translator-rs.git"
path = "/home/david/git/translator-rs"
features = ["tesseract", "tts", "transliterate", "mucab", "dictionary", "ppocr", "planar-tracker", "gpu"]

[profile.dev]
#debug = false
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "symbols"

[build-dependencies]
cpp_build = "0.5"
cc = "1"
