[workspace]
members = ["crates/*"]

[package]
name = "offline-translator-linux"
version = "0.1.5"
edition = "2024"

[dependencies]
cld2 = { git = "https://github.com/DavidVentura/rust-cld2.git" }
#cld2 = { path = "../rust-cld2" }
ureq = "3.1.2"
qmetaobject = "0.2"
qttypes = "0.2"
cpp = "0.5"
flate2 = "1.0"
rayon = "1.10"
whoami = { version = "1.6.1", default-features = false }
zip = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Must match translator's glow so GlesRenderer and our FBO share one type/context.
glow = { version = "0.17", default-features = false, optional = true }
font-provider = { path = "crates/font-provider" }
audio-sink = { path = "crates/audio-sink" }

# Cargo has no per-target feature gating, so the translator dependency is
# declared once per target family instead. Windows drops the mupdf-backed pdf
# features and has to name image-render explicitly, which `pdf` would otherwise
# have pulled in for the still-image overlay.
[target.'cfg(not(windows))'.dependencies.translator]
# git = "https://github.com/DavidVentura/translator-rs.git"
path = "/home/david/git/translator-rs"
default-features = false
features = ["tts", "transliterate", "mucab", "dictionary", "ppocr", "pdf", "pdf-image-translate", "epub", "odt"]

[target.'cfg(windows)'.dependencies.translator]
# git = "https://github.com/DavidVentura/translator-rs.git"
path = "/home/david/git/translator-rs"
default-features = false
features = ["tts", "transliterate", "mucab", "dictionary", "ppocr", "epub", "odt", "image-render"]

[features]
# Empty on purpose: features can't be target-gated the way the dependency above
# is, and both of these pull code that only builds on Linux. Defaulting them on
# would make a bare Windows build fail on mupdf, so Linux opts in instead
# (`--features live,pdf`).
default = []
# The live camera viewfinder + on-frame OCR: pulls translator's GL/tracker stack
# and builds the QtMultimedia video filter. Off for non-Linux targets, which have
# no camera path wired up.
live = ["translator/gpu", "dep:glow"]
# Document translation of PDFs, including the image/raster overlay passes.
pdf = ["translator/pdf", "translator/pdf-image-translate"]

[profile.dev]
#debug = false
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "symbols"

[build-dependencies]
cpp_build = "0.5"
cc = "1"
